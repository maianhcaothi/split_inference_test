name: YOLO
server:
  cut-layer: b # or b, c, d
  clients:
    - 9 #edge
    - 3 #cloud
  model: yolo26n
  batch-size: 32
experiment:
  enable: False  #False
  mode: only_cloud
  #mode: only_edge
rabbit:
  address: 192.168.101.91
  username: "machine-1"
  password: "123456"
  virtual-host: /

debug-mode: False
data: videohungyen.mp4
log-path: .
compress:
  enable: True
  num_bit: 8

clustering:
  enable: True         # True → Hungarian tự chọn cut point; False → dùng cut-layer cố định
  num_A: 3              # num_A + num_B + num_C = clients[0] (tổng edge)
  num_B: 3
  num_C: 3
  num_cloud: 3         # = clients[1] (tổng cloud)
  max_clusters: 3      # <= min(clients[0], clients[1])
  network_rate_mb_s: 9  # MB/s egress MỖI edge (không phải tổng đường truyền!). Solver cộng
                          # 1/tau của từng edge (Clustering.pair_metrics_for_cut) nên nó cần phần
                          # băng thông riêng của mỗi edge. Với 9 edge chung 1 NIC, đặt ~ (tốc độ
                          # đường truyền) / 9. KHÔNG có chỗ nào trong thuật toán chia cho số edge.
  measure_bandwidth: False # True → mỗi client tự đo egress lúc đăng ký; False → dùng network_rate_mb_s.
                          # Lưu ý: phép đo chỉ đúng khi 9 edge đo ĐỒNG THỜI (lúc đó contention đã
                          # nằm trong số đo, và không cần chia thêm). Client đo ngay sau bước
                          # profiling, nên nếu máy nào cache profile miss thì nó lệch pha và đo được
                          # đường truyền rỗng → báo cao. Server in ra spread giữa các edge và cảnh
                          # báo khi > 3x. Muốn cut TÁI LẬP ĐƯỢC giữa các run thì đặt False.
  profile_source: real     # auto → dùng real nếu có, không thì simulated; real → ép dùng real; simulated → ép dùng giả lập

profiling:                  # ĐO per-layer time của model (proxy cho GFLOPs) để feed vào clustering.
  warmup: 10                # số lần chạy LÀM NÓNG trước khi đo (mọi máy). KHÔNG tính vào trung bình.
  runs_default: 100         # số lần ĐO (sau warmup) khi --name không nằm trong runs_by_name.
  runs_by_name:             # số lần đo theo TỪNG máy — scale theo vCPU (≈ 250 × số core).
    machine-2: 500          #  2 vCPU
    machine-3: 500          #  2 vCPU
    machine-4: 500          #  2 vCPU
    machine-5: 250          #  1 vCPU
    machine-6: 250          #  1 vCPU
    machine-7: 250          #  1 vCPU
    machine-8: 1000         #  4 vCPU
    machine-9: 1000         #  4 vCPU
    machine-10: 1000        #  4 vCPU
    device-1: 1000          #  4 vCPU
    device-2: 1000          #  4 vCPU
    device-3: 1000          #  4 vCPU
  # Profile CHỈ chạy LẦN ĐẦU: nếu profile_{model}_{device}_bs{bs}_fp32.npy đã tồn tại thì
  # NẠP CACHE, không đo lại (Profiler.profile_or_load kiểm tra os.path.exists trước). Đổi số
  # lần đo ở đây KHÔNG tự xoá cache — phải xoá *_fp32.npy trên máy đó thì lần sau mới đo lại.

multithreading:
  enable: True            # chỉ hoạt động ở mode: split. Mỗi device chạy 2 luồng pipeline.
  queue_size: 1           # số batch tối đa chờ giữa luồng inference và luồng transfer (mỗi device).
                          # 1 = double-buffering, đủ để 2 luồng overlap. Đệm sâu hơn KHÔNG tăng
                          # throughput (throughput bị chặn bởi phần cứng, không bởi độ sâu đệm) mà
                          # chỉ cộng thêm latency: mỗi batch nằm chờ trong in_q + out_q. Ở
                          # queue_size=4 đó là tới 8 batch x ~11.6s = ~93s, đúng bằng e2e p50 ~68s
                          # đo được ở run 0730_0917. Đồng thời mỗi batch uint8 chiếm 39MB nên 4 ->
                          # 1 giảm ~4x RAM đệm trên máy chạy 9 edge.

performance:
  # torch intra-op threads MỖI process.
  #   auto = n_core / procs_per_machine (xem dưới).
  #   0    = không can thiệp, để mặc định của torch (= n_core mỗi process).
  #   N    = đặt cứng N threads.
  # Vì sao cần: mặc định torch lấy n_core threads cho MỖI process, nên 9 edge
  # process trên 1 máy 20 core sinh ra 180 luồng compute giành 20 core. Oversub
  # kiểu này làm chậm tất cả mà không tăng throughput.
  # Override cho từng máy: python client.py --layer_id 1 --threads 2
  torch_threads: auto
  procs_per_machine: 1    # số process CÙNG VAI chạy trên MỘT máy vật lý.
                          # Test bed hiện tại: mỗi edge/cloud là 1 VM riêng chạy
                          # đúng 1 process -> 1. Xem testbed.md.
                          # Bỏ trống = giả định cả role dồn trên 1 máy (edge ->
                          # clients[0]=9, cloud -> clients[1]=3). KHÔNG để trống
                          # trên topology 1-process-1-VM: n_core // 9 = 0 với mọi
                          # VM dưới 9 core, nên max(1, ...) ghim CẢ máy 4 core,
                          # 2 core lẫn 1 core về 1 thread — vừa phí 3/4 số core,
                          # vừa xoá sạch khác biệt phần cứng mà clustering cần
                          # thấy (mọi edge profile ra cùng tốc độ -> cụm chia
                          # theo nhiễu đo đạc).
                          # ĐỔI GIÁ TRỊ NÀY = phải xoá profile_*.npy trên MỌI máy,
                          # cache không mã hoá số thread vào tên file.

backpressure:
  enable: True            # edge dừng gửi khi intermediate_queue quá sâu → chống tràn RAM broker
  max_queue: 10           # ngưỡng độ sâu queue (số message) cho mode split; only_cloud dùng cap riêng (15)

detections:
  save_json: True         # ghi detections.json khi kết thúc (đọc streaming từ jsonl → RAM phẳng). False = bỏ qua.
                          # False cũng tắt luôn việc ghi detections_stream.jsonl trong lúc chạy
                          # (1 lần open+write+close MỖI FRAME, nằm trong khoảng đo busy).

free_time:                # THỜI GIAN RẢNH của từng device/máy: khoảng wall-clock KHÔNG làm gì cả
  enable: True            # (không inference, không gửi, không nén, không giải nén, không postprocess).
                          # Mỗi device gộp (UNION) các khoảng bận của TẤT CẢ luồng của nó rồi lấy
                          # phần còn lại — cộng dồn thì sai, vì 2 luồng pipeline chạy song song và
                          # tổng có thể vượt quá thời gian thực.
                          #   · device tự ghi free_time_<role>_<cluster>_<id>.log (có cả series theo
                          #     bucket để vẽ), rồi gửi report về freetime_queue;
                          #   · server gom lúc shutdown → free_time.log (mỗi device 1 dòng),
                          #     free_time_cluster.log (theo cluster / role / MÁY / SYSTEM),
                          #     free_time_series.log (mỗi device mỗi bucket 1 dòng, để vẽ heat-map).
                          # KHÁC với utilization.log: utilization đo busy/total trong cửa sổ
                          # get_input→output của MỘT luồng (nên thời gian chờ bên trong cửa sổ đó bị
                          # tính là bận, và việc luồng kia làm thì không được tính). free% và
                          # utilization% KHÔNG cộng lại thành 100%.
  bucket_s: 1.0           # độ rộng bucket của chuỗi free-time (giây). Run dài thì bucket tự nới ra
                          # để không bao giờ gửi quá 3600 điểm mỗi device.
  collect_timeout_s: 30   # thời gian chờ tối đa để gom đủ report từ các device

broker_ram:               # RAM của MÁY CHẠY QUEUE (RabbitMQ), do SERVER đo từ đầu đến cuối run.
  enable: True            # Không có process nào của mình chạy trên máy đó, nên server kéo số liệu
                          # từ xa qua SSH: 1 phiên SSH duy nhất chạy vòng lặp đọc /proc/meminfo trên
                          # máy queue (KHÔNG phải mỗi mẫu một lần SSH — như vậy là bắt chính cái máy
                          # đang đo phải bắt tay TCP + auth mỗi giây).
                          #   · broker_ram_ns.log  — mỗi mẫu 1 dòng (chuỗi để vẽ)
                          #   · broker_ram.log     — tổng kết cả run (min/mean/p95/max, growth, peak)
                          # Vì sao cần: mọi feature map trung gian đều đi qua máy này. Batch 32 chưa
                          # nén ~39MB/message, queue sâu 10 message là ~400MB nằm trong RAM broker.
                          # Khi chạm high-water mark RabbitMQ CHẶN publisher — trên device chỉ thấy
                          # đứng hình, free time đổ vào 'backpressure'/'downstream' mà bản thân device
                          # không có gì sai. Đường RAM của broker là thứ phân biệt 2 trường hợp đó.
  host: ""                # bỏ trống = dùng rabbit.address
  user: ""                # TÀI KHOẢN SSH của máy queue (KHÁC rabbit.username/password ở trên —
  password: ""            # cái đó là credential AMQP, không mở được shell)
  ssh_port: 22
  interval_s: 1.0         # chu kỳ lấy mẫu (giây)
  tail_s: 2.0             # đo THÊM bao nhiêu giây SAU KHI run kết thúc (sau cả drain). Cửa sổ đo
                          # bắt đầu từ lúc SERVER KHỞI ĐỘNG (chưa client nào đăng ký, chưa message
                          # nào được gửi) nên đoạn đầu series là máy queue LÚC RẢNH — đó là mốc
                          # so sánh: chạy hệ thống thì RAM máy queue tăng bao nhiêu so với lúc không
                          # chạy. Series được chia 3 pha trong broker_ram.log: PHASE idle (trước
                          # dispatch) / run (đang chạy) / tail (sau khi xong), cộng 1 dòng COMPARE.
                          # tail ngắn (1-2s) là CỐ Ý: đủ để thấy broker nhả RAM sau drain, không đủ
                          # để chờ Erlang GC — nên tail còn dương nghĩa là "chưa về", chưa phải leak.
  api_port: 15672         # chỉ dùng cho fallback: nếu SSH không mở được, server chuyển sang management
                          # API. Khi đó used_mb là RAM CỦA TIẾN TRÌNH BROKER, không phải RAM của máy —
                          # log ghi rõ source=rabbitmq_api để không nhầm.

message_size:             # KÍCH THƯỚC MESSAGE edge đẩy lên queue, đo TRƯỚC KHI publish.
  enable: True            # CHỈ MỘT device đo: client ĐĂNG KÝ ĐẦU TIÊN ở layer_id=1 (thứ tự REGISTER).
                          # Server chọn và bật cờ measure=True trong START của riêng máy đó — client
                          # KHÔNG tự quyết định, nên việc đo không bao giờ rơi vào 2 máy hoặc 0 máy.
                          # Vì sao chỉ 1: mọi edge trong cùng cluster gửi cùng một feature map từ cùng
                          # một cut, đo cả 9 máy tốn gấp 9 lần mà ra cùng một con số.
                          #   · device tự ghi message_size_<cluster>_<id>.log ngay trong lúc chạy
                          #     (mỗi message 1 dòng — bản này sống sót nếu broker/server có sự cố),
                          #     rồi gửi report về msgsize_queue lúc kết thúc;
                          #   · server gom lúc shutdown → message_size.log (1 dòng tổng kết) và
                          #     message_size_series.log (mỗi message 1 dòng, để vẽ).
                          # Dùng để làm gì: đây là con số giải thích đường RAM của broker (broker_ram)
                          # và băng thông thực tế mỗi edge chiếm. Batch 32 chưa nén ~39MB/message.
  collect_timeout_s: 30   # thời gian chờ tối đa để nhận report từ máy được chọn
  max_samples: 5000       # số mẫu TỐI ĐA gửi kèm cho chuỗi vẽ (thưa đều nếu run dài hơn). Thống kê
                          # (mean/p50/p95/max) luôn tính trên TOÀN BỘ mẫu, không phải trên phần thưa.

map:                      # 2 pipeline mAP chạy ở Server lúc shutdown (ground truth = map/label/)
  enable: True            # False = TẮT toàn bộ mAP per-batch trên device. Mỗi batch hiện phải trả:
                          #   - 1 pass postprocess_yolo thứ hai ở conf=0.001 (ngưỡng này giữ gần như
                          #     mọi anchor nên NMS của nó lớn hơn hẳn pass conf=0.25),
                          #   - batch_size file map/pred/.../frame_NNNNNN.txt,
                          #   - batch_size lần map_metric.update (torchmetrics).
                          # Toàn bộ nằm TRONG khoảng get_input→output nên bị tính vào busy_s và e2e.
                          # → Khi đo throughput/latency hãy đặt False. Đừng đo mAP và FPS cùng 1 run.
  window_batches: 16      # pipeline 1: cửa sổ trượt gồm N batch liên tiếp, dịch 1 batch mỗi bước → map_window.log
  collect_timeout_s: 30   # thời gian chờ tối đa để thu đủ zip map/pred/ từ các cloud/edge

adaptive:
  enable: False            # chỉ hoạt động ở mode: split. Server nudge cut point theo độ sâu queue.
  batches_per_check: 20   # N: đánh giá lại sau mỗi N batch được xử lý (đếm qua management API)
  high_threshold: 8       # queue depth >= giá trị này → coi là "overflow"
  low_threshold: 1        # queue depth <= giá trị này → coi là "empty"
  high_ratio: 0.6         # >=60% mẫu trong window là overflow → cut sâu hơn (edge làm nhiều hơn)
  low_ratio: 0.6          # >=60% mẫu trong window là empty    → cut nông hơn (cloud làm nhiều hơn)
  poll_interval_s: 0.25   # chu kỳ lấy mẫu queue depth trong một window
  step: 1                 # số layer dịch chuyển mỗi lần điều chỉnh
  cooldown_batches: 20    # số batch tối thiểu giữa 2 lần điều chỉnh (chống dao động)
  max_message_mb: 15.0    # KHÔNG chuyển cut tới điểm có feature map ước tính > ngưỡng này (đệm dưới
                          # max_message_size của RabbitMQ, mặc định broker 16MB). Nếu tăng broker limit
                          # thì tăng luôn giá trị này để controller được phép dùng các cut lớn hơn.