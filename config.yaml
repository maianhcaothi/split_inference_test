name: YOLO
server:
  cut-layer: a # or b, c, d
  clients:
    - 9 #edge
    - 3 #cloud
  model: yolo26n
  batch-size: 32
experiment:
  enable: False  #False
  mode: only_cloud
  #mode: only_edge
rabbit:
  address: 192.168.101.91
  username: "machine-1"
  password: "123456"
  virtual-host: /

debug-mode: False
data: video.mp4
log-path: .
compress:
  enable: True
  num_bit: 8

clustering:
  enable: True         # True → Hungarian tự chọn cut point; False → dùng cut-layer cố định
  num_A: 3              # num_A + num_B + num_C = clients[0] (tổng edge)
  num_B: 3
  num_C: 3
  num_cloud: 3         # = clients[1] (tổng cloud)
  max_clusters: 3      # <= min(clients[0], clients[1])
  network_rate_mb_s: 100.0
  measure_bandwidth: True # True → đo thực tế mỗi lần chạy; False → dùng network_rate_mb_s cố định
  profile_source: real     # auto → dùng real nếu có, không thì simulated; real → ép dùng real; simulated → ép dùng giả lập

multithreading:
  enable: True            # chỉ hoạt động ở mode: split. Mỗi device chạy 2 luồng pipeline.
  queue_size: 4           # số batch tối đa chờ giữa luồng inference và luồng transfer (mỗi device)

backpressure:
  enable: True            # edge dừng gửi khi intermediate_queue quá sâu → chống tràn RAM broker
  max_queue: 10           # ngưỡng độ sâu queue (số message) cho mode split; only_cloud dùng cap riêng (15)

detections:
  save_json: True         # ghi detections.json khi kết thúc (đọc streaming từ jsonl → RAM phẳng). False = bỏ qua.

adaptive:
  enable: True            # chỉ hoạt động ở mode: split. Server nudge cut point theo độ sâu queue.
  batches_per_check: 20   # N: đánh giá lại sau mỗi N batch được xử lý (đếm qua management API)
  high_threshold: 8       # queue depth >= giá trị này → coi là "overflow"
  low_threshold: 1        # queue depth <= giá trị này → coi là "empty"
  high_ratio: 0.6         # >=60% mẫu trong window là overflow → cut sâu hơn (edge làm nhiều hơn)
  low_ratio: 0.6          # >=60% mẫu trong window là empty    → cut nông hơn (cloud làm nhiều hơn)
  poll_interval_s: 0.25   # chu kỳ lấy mẫu queue depth trong một window
  step: 1                 # số layer dịch chuyển mỗi lần điều chỉnh
  cooldown_batches: 20    # số batch tối thiểu giữa 2 lần điều chỉnh (chống dao động)
  max_message_mb: 15.0    # KHÔNG chuyển cut tới điểm có feature map ước tính > ngưỡng này (đệm dưới
                          # max_message_size của RabbitMQ, mặc định broker 16MB). Nếu tăng broker limit
                          # thì tăng luôn giá trị này để controller được phép dùng các cut lớn hơn.