name: YOLO
server:
  cut-layer: b # or b, c, d
  clients:
    - 9 #edge
    - 3 #cloud
  model: yolo26n
  batch-size: 32
experiment:
  enable: False  #False
  mode: only_cloud
  #mode: only_edge
rabbit:
  address: 192.168.101.91
  username: "machine-1"
  password: "123456"
  virtual-host: /

debug-mode: False
data: videohungyen.mp4
log-path: .
compress:
  enable: True
  num_bit: 8

clustering:
  enable: True         # True → Hungarian tự chọn cut point; False → dùng cut-layer cố định
  num_A: 3              # num_A + num_B + num_C = clients[0] (tổng edge)
  num_B: 3
  num_C: 3
  num_cloud: 3         # = clients[1] (tổng cloud)
  max_clusters: 3      # <= min(clients[0], clients[1])
  network_rate_mb_s: 13.0 # MB/s egress MỖI edge (KHÔNG phải tổng đường truyền!). Solver cộng
                          # 1/tau của từng edge (Clustering.pair_metrics_for_cut) nên nó cần phần
                          # băng thông riêng của mỗi edge.
                          # 13.0 = GIẢ ĐỊNH host NIC 1 Gbps (~125 MB/s) chia cho 9 edge. HÃY KIỂM
                          # CHỨNG: đo tốc độ thật giữa 1 VM edge và máy broker (iperf3, hoặc copy
                          # một file lớn), rồi chia cho số edge. Giá trị cũ 100.0 tương đương
                          # 900 MB/s tổng (~7 Gbps) — gần như chắc chắn quá lạc quan, và rate quá
                          # cao làm solver tưởng truyền dữ liệu miễn phí → chọn cut sâu, feature
                          # map to → NIC thành nút cổ chai.
                          # Dùng tools/replay_clustering.py để xem K và cut đổi thế nào theo rate.
  # ─── CHỌN CÁCH ĐO: legacy (code tháng 7) hay new ─────────────────────────
  measure_mode: new       # legacy | new   — chỉ đổi những thứ LÀM ĐỔI KẾT QUẢ:
                          #
                          #  legacy = đúng chuỗi đo của tháng 7 (đã cho 32 fps):
                          #     · đo băng thông: 1 MB qua rpc_queue → server → reply_queue,
                          #       chờ ACK bằng vòng poll 5 ms (gồm cả thời gian server đáp)
                          #     · KHÔNG chia egress_share
                          #     · cut_data_sizes để nguyên float32 (không scale theo num_bit)
                          #     · KHÔNG cap kích thước bản tin cho cut khởi tạo
                          #
                          #  new = chuỗi đo đã sửa:
                          #     · đo băng thông: publish thẳng 4 MB vào queue riêng (đúng
                          #       đường mà run thật dùng), không qua server, không poll
                          #     · chia cho egress_share
                          #     · scale cut_data_sizes theo compress.num_bit
                          #     · cap kích thước bản tin cho cut khởi tạo
                          #
                          # KHÔNG nằm trong công tắc này (luôn bật): guard một-server-duy-nhất,
                          # xoá queue trong delete_old_queues, idle watchdog. Đó là các bản vá
                          # chống HỎNG PHÉP ĐO (nhiều server chia nhau luồng DONE làm FPS bị
                          # chia). Nếu tắt chúng ở nhánh legacy thì nhánh đó sẽ báo FPS thấp
                          # hơn thực 4 lần, và bạn sẽ so sánh cái bug chứ không so thuật toán.
                          #
                          # Tên thư mục kết quả tự động kèm mode: results_MMDD_HHMM_split_legacy
                          # / _split_new, nên hai lần chạy không bao giờ lẫn.
  bandwidth_payload_mb:   # để trống = mặc định theo mode (legacy 1.0 / new 4.0)
  bandwidth_runs:         # để trống = mặc định theo mode (legacy 3 / new 5)

  measure_bandwidth: False # True → mỗi client tự đo egress lúc đăng ký; False → dùng network_rate_mb_s.
                          # ĐANG ĐỂ False có chủ đích: phép đo luôn diễn ra khi đường truyền RỖNG
                          # (client đo ngay sau torch.load + profiling, mà hai bước đó kết thúc lệch
                          # nhau vài giây tới vài phút giữa các VM — trong khi để các phép đo đè lên
                          # nhau thì cần lệch < 0.2s). Nên nó luôn báo về tốc độ full-link chứ không
                          # phải phần chia. egress_share ở dưới bù lại điều đó, nhưng pin cứng
                          # network_rate_mb_s vẫn là cách duy nhất để cut TÁI LẬP ĐƯỢC giữa các run.
  egress_share: auto      # chia tốc độ ĐO ĐƯỢC cho bao nhiêu edge dùng chung một uplink.
                          #   auto = số edge (topology hiện tại: 9 VM edge chung 1 NIC của host)
                          #   1    = mỗi edge có uplink riêng thật sự
                          # Vì sao cần: solver cộng 1/tau của từng edge (coi chúng là producer song
                          # song độc lập), nên nếu đưa vào 9 giá trị full-link thì nó tưởng cụm có
                          # 9x egress → chọn cut nông/feature map to → NIC thành nút cổ chai.
                          # KHÔNG áp dụng cho network_rate_mb_s (giá trị đó bạn đã tự đặt per-edge).
  profile_source: real     # auto → dùng real nếu có, không thì simulated; real → ép dùng real; simulated → ép dùng giả lập

multithreading:
  enable: True            # chỉ hoạt động ở mode: split. Mỗi device chạy 2 luồng pipeline.
  queue_size: 4           # số batch tối đa chờ giữa luồng inference và luồng transfer (mỗi device).
                          # ĐÁNH ĐỔI THROUGHPUT <-> LATENCY, và với hệ này throughput thắng:
                          #   - Thí nghiệm scaling (9 / 6 / 3 máy) cho thấy FPS tỉ lệ THUẬN với số
                          #     máy => không có tài nguyên chung nào bão hoà. Mỗi pipeline bị chặn
                          #     bởi ĐỘ TRỄ, không bởi băng thông.
                          #   - Pipeline bị chặn bởi độ trễ thì đệm sâu là thứ hấp thụ jitter và cho
                          #     các tầng chạy vượt lên nhau. queue_size=1 làm luồng infer đói ngay
                          #     khi tầng trước trễ một nhịp.
                          # Cái giá: mỗi batch nằm chờ trong in_q + out_q nên e2e latency tăng theo
                          # độ sâu. Nếu bạn tối ưu LATENCY thay vì FPS thì hạ về 1.
                          # Nên quét 1 / 4 / 8 và xem đường cong FPS trước khi chốt.

performance:
  # torch intra-op threads MỖI process.
  #   0    = không can thiệp (ĐÚNG khi mỗi device là 1 VM/1 máy riêng — lúc đó
  #          os.cpu_count() đã chính là vCPU của riêng VM, torch tự giới hạn đúng).
  #   N    = đặt cứng N threads.
  #   auto = n_core / procs_per_host  (chỉ dùng khi NHIỀU device process
  #          dùng CHUNG một OS).
  torch_threads: 0

  # Số device process dùng chung MỘT OS. Chỉ có ý nghĩa với torch_threads: auto.
  #   1 = mỗi device 1 VM/1 máy riêng (topology hiện tại) → auto không chia gì.
  #   9 = 9 process edge trong cùng 1 OS → auto = n_core/9.
  procs_per_host: 1

  # LƯU Ý cho VM trên host bị oversubscribe (topology hiện tại: 9 VM edge +
  # 3 VM cloud trên cùng host): VM nhiều vCPU có thể CHẬM HƠN VM ít vCPU.
  #   - VM 4 vCPU cần 4 core vật lý rảnh CÙNG LÚC mới chạy được vùng song song
  #     (co-scheduling), nên bị xếp hàng chờ nhiều hơn VM 1 vCPU;
  #   - torch mở 4 luồng, và khi hypervisor rút 1 vCPU đi giữa vùng song song thì
  #     3 luồng còn lại busy-spin ở fork-join barrier, đốt quota của chính VM.
  # Nếu thấy VM nhiều vCPU chậm hơn, thử trên đúng VM đó:
  #     python client.py --layer_id 1 --threads 1
  # và/hoặc đặt biến môi trường OMP_WAIT_POLICY=passive để barrier ngủ thay vì spin.

fps:
  idle_timeout_s: 600     # run đã START mà không có DONE nào trong ngần này giây → server tự kết
                          # thúc (in summary, thu utilization, archive) rồi thoát.
                          # Vì sao cần: đường tắt máy bình thường chỉ được kích hoạt khi ĐỦ CẢ 9
                          # edge gửi NOTIFY. Chỉ cần 1 edge không tới đích (bạn dừng client, VM lỗi
                          # mở video, client crash) là server treo trong start_consuming() VĨNH VIỄN
                          # — và nó vẫn giữ consumer trên fps_queue, âm thầm ăn bớt DONE của mọi run
                          # sau đó. 4 server sót = 4 lần chạy dở.

backpressure:
  enable: True            # edge dừng gửi khi intermediate_queue quá sâu → chống tràn RAM broker
  max_queue: 10           # ngưỡng độ sâu queue (số message) cho mode split; only_cloud dùng cap riêng (15)

detections:
  save_json: True         # ghi detections.json khi kết thúc (đọc streaming từ jsonl → RAM phẳng). False = bỏ qua.
                          # False cũng tắt luôn việc ghi detections_stream.jsonl trong lúc chạy
                          # (1 lần open+write+close MỖI FRAME, nằm trong khoảng đo busy).

free_time:                # THỜI GIAN RẢNH của từng device/máy: khoảng wall-clock KHÔNG làm gì cả
  enable: True            # (không inference, không gửi, không nén, không giải nén, không postprocess).
                          # Mỗi device gộp (UNION) các khoảng bận của TẤT CẢ luồng của nó rồi lấy
                          # phần còn lại — cộng dồn thì sai, vì 2 luồng pipeline chạy song song và
                          # tổng có thể vượt quá thời gian thực.
                          #   · device tự ghi free_time_<role>_<cluster>_<id>.log (có cả series theo
                          #     bucket để vẽ), rồi gửi report về freetime_queue;
                          #   · server gom lúc shutdown → free_time.log (mỗi device 1 dòng),
                          #     free_time_cluster.log (theo cluster / role / MÁY / SYSTEM),
                          #     free_time_series.log (mỗi device mỗi bucket 1 dòng, để vẽ heat-map).
                          # KHÁC với utilization.log: utilization đo busy/total trong cửa sổ
                          # get_input→output của MỘT luồng (nên thời gian chờ bên trong cửa sổ đó bị
                          # tính là bận, và việc luồng kia làm thì không được tính). free% và
                          # utilization% KHÔNG cộng lại thành 100%.
  bucket_s: 1.0           # độ rộng bucket của chuỗi free-time (giây). Run dài thì bucket tự nới ra
                          # để không bao giờ gửi quá 3600 điểm mỗi device.
  collect_timeout_s: 30   # thời gian chờ tối đa để gom đủ report từ các device

map:                      # 2 pipeline mAP chạy ở Server lúc shutdown (ground truth = map/label/)
  enable: True            # False = TẮT toàn bộ mAP per-batch trên device. Mỗi batch hiện phải trả:
                          #   - 1 pass postprocess_yolo thứ hai ở conf=0.001 (ngưỡng này giữ gần như
                          #     mọi anchor nên NMS của nó lớn hơn hẳn pass conf=0.25),
                          #   - batch_size file map/pred/.../frame_NNNNNN.txt,
                          #   - batch_size lần map_metric.update (torchmetrics).
                          # Toàn bộ nằm TRONG khoảng get_input→output nên bị tính vào busy_s và e2e.
                          # → Khi đo throughput/latency hãy đặt False. Đừng đo mAP và FPS cùng 1 run.
  window_batches: 16      # pipeline 1: cửa sổ trượt gồm N batch liên tiếp, dịch 1 batch mỗi bước → map_window.log
  collect_timeout_s: 30   # thời gian chờ tối đa để thu đủ zip map/pred/ từ các cloud/edge

adaptive:
  enable: False            # chỉ hoạt động ở mode: split. Server nudge cut point theo độ sâu queue.
  batches_per_check: 20   # N: đánh giá lại sau mỗi N batch được xử lý (đếm qua management API)
  high_threshold: 8       # queue depth >= giá trị này → coi là "overflow"
  low_threshold: 1        # queue depth <= giá trị này → coi là "empty"
  high_ratio: 0.6         # >=60% mẫu trong window là overflow → cut sâu hơn (edge làm nhiều hơn)
  low_ratio: 0.6          # >=60% mẫu trong window là empty    → cut nông hơn (cloud làm nhiều hơn)
  poll_interval_s: 0.25   # chu kỳ lấy mẫu queue depth trong một window
  step: 1                 # số layer dịch chuyển mỗi lần điều chỉnh
  cooldown_batches: 20    # số batch tối thiểu giữa 2 lần điều chỉnh (chống dao động)
  max_message_mb: 15.0    # KHÔNG chuyển cut tới điểm có feature map ước tính > ngưỡng này (đệm dưới
                          # max_message_size của RabbitMQ, mặc định broker 16MB). Nếu tăng broker limit
                          # thì tăng luôn giá trị này để controller được phép dùng các cut lớn hơn.